<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meta | Social Metaverse</title>
    <link rel="icon" href="./img/meta.png">
    <style>

        body{
            margin: 20px;
            padding: 5px;
            background-color: #F7F7F7;
        }
        .meta img{
            border: 0px solid black;
            display: flex;
            height: auto;
            width: 30%;
            position: relative;
            margin: 25%;
            margin-left: 40%;
            margin-top: 50px;

        }

        .divi line{
            
            flex-grow: 1px;
            height: 1px;
            width: 100%;
            position: relative;
            top: -100px;
            
        }

        .divi{

            border: 0px solid;
            height: auto;
            width: 40%;
            margin: 25%;
            margin-top: -300px;
            margin-left: 35%;
            position: relative;
        }

        .logo {
            height: auto;
            width: 25%;
            margin: 20px;
            display: flex;
            position: relative;

        }

        .logo img{
            border: 0px solid black;
            display: flex;
            position: relative;
            height: 300px;
            width: 300px;
            margin: 200px;
            margin-top: -650px;
            margin-left: 250px;
            padding: 10px;
            mix-blend-mode: multiply;
            background-color: white;
        }

     

        .divider line{
            flex-grow: 1px;
            height: 100%;
            width: 1px;
            position: relative;
            

        }

        .divider{
            border: 0px solid;
            height: auto;
            width: 50%;
            margin: 25%;
            rotate: 90deg;
            position: relative;
            margin-left: 30%;
            margin-top: 550px;

        }


        
    </style>
</head>
<body>
    <div class="body">
        <div class="meta">
            <img src="./img/meta-logo-primary_standardsize.svg" alt=""/>
        

        </div>
        <div class="divi">
            <hr class="line" />
        </div>

        <div class="divider">
            <hr class="line"/>
        </div>
        
        <div class="logo">

            
                <a href="./Facebook/login.html">
                    <img src="./img/fb.png" alt=""/>
                </a>
                
            
    
            
    
            
                <a href="./Instagram/log-in.html">
                    <img src="./img/ig.png" alt=""/>
                </a>
               
           

        </div>

        

    </div>

    
</body>
</html>
