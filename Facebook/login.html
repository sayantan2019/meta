<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facebook</title>
    <link rel="Stylesheet" href="login.css"/>
    <link rel="icon" href="./Images/icons8-facebook-50.png">
</head>
<body>
    <div class="body">
        <div class="header">
            <div class="left-header">
                <img src="./Images/fb text.svg" alt="" class="fb-text">
                <h2 class="tag-line">Facebook helps you connect and share with the people in your life.</h2>
            </div>

            <div class="right-header">
                <div class="login-box">
                    <form action="" method="">
                        <input type="text" placeholder="Email address or phone number" id="username">
                        <input type="password" placeholder="Password" id="password">
                    </form>

                    <button id="login-btn">Log in</button>

                    <div class="forgotten-password" style="align-items: center; justify-content: center; display: flex; ">
                        <a href="#" style="color: #197cec; text-decoration: none; font-weight: normal; font-family: 'Proxima Nova', sans-serif;">Forgotten pasword?</a>
                    </div>

                    <div class="divider">
                        <hr class="line" />
                    </div>


                    <div class="act">
                        <button class="create-act" id="create-act">Create new account</button>
                    </div>
                    
                </div>

                <div class="page" style="align-items: center; justify-content: center; display: flex;">
                    <a href="#" style="color: black; text-decoration: none; font-weight: bold; font-family: 'Proxima Nova', sans-serif;">Create a page</a> 
                    <br>
                    <p style="color: black; margin-left: 3px;"> for a celebrity, brand or business.</p>
                </div>


            </div>
        </div>

        <div class="footer">


        </div>
    </div>
    
</body>
</html>
