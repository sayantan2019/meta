<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up • Instagram</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=Xy10Jcu1L2Su&format=png&color=000000" type="icon">
    <link rel="stylesheet" href="registerstyle.css" />

</head>

<body>
    <div class="contain">
        <div class="sign-up">
            <div class="box">

                <div class="login-box">
                    <img src="Images/instaTextLogo.png" alt="" class="instaTextLogo">
                </div>

                <div class="photos-videos-text">
                    <p>Sign up to see photos and videos from your friends.</p>
                </div>

                <div class="login-with-facebook">
                    <button class="q">
                        <img src="/login/Images/facebook-icon-png-774.png" class="fb-img" />Log in with facebook
                    </button>
                </div>

                <button class="qr">
                    Use QR Code
                </button>

                <div class="divider">
                    <hr class="line" />
                    <p>OR</p>
                    <hr class="line" />
                </div>

                <div class="sigin-box">

                    <input type="text" placeholder="Mobile Number or email">
                    <input type="password" placeholder="Password">
                    <input type="text" placeholder="Full Name">
                    <input type="text" placeholder="Username">
                    <button class="sign-up-btn">Sign up</button>

                    <div class="terms-condition">
                        <p>People who use our service may have uploaded your contact information to Instagram. <a
                                href="#" class="">Learn More</a></p>
                        <p2>By signing up, you agree to our <a href="#">Terms, Privacy
                                Policy and Cookies Policy
                            </a></p>
                    </div>

                </div>
            </div>

        </div>

        <div class="have-an-account">
            <p>
                Have an account? <a href="log-in.html">Log in</a>
            </p>
        </div>

        <div class="download-section">
            <p>Get the app</p>
            <div class="app-btn">
                <img src="Images/appstore.png" alt="" class="app-btn" />
                <img src="Images//playstore.png" alt="" class="app-btn" />
            </div>
        </div>

    </div>

<!--<script src="scripts.js"></script>-->

</body>

</html>
